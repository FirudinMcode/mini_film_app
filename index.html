<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>FİKO Studios</title>

    <link rel="stylesheet" href="./src/output.css">
    <link rel="stylesheet" href="src/input.css">
    <link rel="stylesheet" href="./css/style.css">

    <link rel="icon" type="image/png" href="img/fm_logo2.png">

</head>

<body class="bg-gray-900 text-white">

    <header class="fixed top-0 left-0 w-full bg-gray-950/70 backdrop-blur-md z-50 shadow-xl">
        <div class="max-w-7xl mx-auto flex items-center justify-between p-4">
            <h1 onclick="goTo('index.html')" class="cursor-pointer text-3xl font-bold tracking-wider text-red-500">
                FİKO Studios
            </h1>
            <nav class="flex gap-6 text-lg">
                <a href="index.html" class="nav-link hover:text-red-400">Ana səhifə</a>
                <a href="pages/topfilms.html" class="nav-link hover:text-red-400">Top Filmlər</a>
                <a href="pages/about.html" class="nav-link hover:text-red-400">Haqqında</a>
            </nav>
        </div>
    </header>

    <div class="pt-24"></div>

    <section id="h-slider" class="relative w-full overflow-hidden py-4">
        <h2 class="text-2xl font-semibold mb-3 px-4">Populyar Filmlər</h2>

        <button id="h-prev" class="h-btn left-2">&#10094;</button>
        <button id="h-next" class="h-btn right-2">&#10095;</button>

        <div id="h-track" class="flex gap-4 px-4 transition-transform duration-500"></div>
    </section>


    <section class="max-w-7xl mx-auto mt-10 px-4 flex flex-wrap items-center justify-between gap-4">
        <input id="searchInput" class="w-72 px-4 py-2 bg-gray-800 border border-gray-600 rounded-lg focus:outline-none"
            placeholder="Film axtar...">

        <select id="genreFilter" class="px-4 py-2 bg-gray-800 border border-gray-600 rounded-lg">
            <option value="">Bütün janrlar</option>
            <option value="Drama">Drama</option>
            <option value="Thriller">Thriller</option>
            <option value="Action">Action</option>
            <option value="Comedy">Comedy</option>
        </select>
    </section>

    <section id="movieList"
        class="max-w-7xl mx-auto grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 mt-10 px-4">
    </section>

    <div class="max-w-7xl mx-auto text-center mt-10 pb-10">
        <button id="prevPage" class="page-btn">Əvvəlki</button>
        <span id="pageNumber" class="mx-4 text-xl"></span>
        <button id="nextPage" class="page-btn">Növbəti</button>
    </div>

    <footer class="text-center">
        <p>© 2025 FİKO Studios — Hamısı öz əl işimdi</p>
    </footer>

    <script src="./js/app.js"></script>
</body>

</html>
